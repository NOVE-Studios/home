<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Request Received — Nové Studios</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --black:#0b0b0c;
    --gold:#c9a24b;
    --gold-soft:#e4cf9a;
    --paper:#ffffff;
    --ink:#1a1a1a;
    --muted:#7a7a7a;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background:var(--black);
    color:var(--ink);
    font-family:'Jost', sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    padding:32px 20px;
  }
  .card{
    background:var(--paper);
    width:100%;
    max-width:420px;
    border-radius:18px;
    padding:44px 32px 40px;
    text-align:center;
    box-shadow:0 30px 80px rgba(0,0,0,.5);
  }
  .mark{
    width:78px; height:78px;
    margin:0 auto 22px;
    border-radius:50%;
    background:var(--black);
    display:flex; align-items:center; justify-content:center;
  }
  .mark svg{ width:38px; height:38px; }
  .mark circle{
    fill:none; stroke:var(--gold); stroke-width:2;
    stroke-dasharray:220; stroke-dashoffset:220;
    animation:draw 900ms ease-out forwards .15s;
  }
  .mark path{
    fill:none; stroke:var(--gold); stroke-width:2.5;
    stroke-linecap:round; stroke-linejoin:round;
    stroke-dasharray:40; stroke-dashoffset:40;
    animation:draw 400ms ease-out forwards 1s;
  }
  @keyframes draw{ to{ stroke-dashoffset:0; } }

  .eyebrow{
    font-family:'Jost', sans-serif;
    font-size:11px;
    letter-spacing:.22em;
    color:var(--gold);
    text-transform:uppercase;
    margin-bottom:10px;
  }
  h1{
    font-family:'Cormorant Garamond', serif;
    font-weight:600;
    font-size:30px;
    letter-spacing:.01em;
    color:var(--ink);
    margin-bottom:14px;
  }
  p{
    font-size:15px;
    line-height:1.6;
    color:var(--muted);
    font-weight:300;
  }
  p + p{ margin-top:10px; }
  .divider{
    width:36px; height:1px;
    background:var(--gold-soft);
    margin:24px auto;
  }
  .wa-btn{
    display:inline-flex;
    align-items:center;
    gap:9px;
    margin-top:26px;
    padding:13px 26px;
    background:var(--black);
    color:var(--paper);
    text-decoration:none;
    border-radius:999px;
    font-size:14px;
    letter-spacing:.03em;
    transition:opacity .2s;
  }
  .wa-btn:hover{ opacity:.85; }
  .wa-btn svg{ width:16px; height:16px; fill:var(--gold); }
  .brand{
    margin-top:34px;
    font-family:'Cormorant Garamond', serif;
    font-size:13px;
    letter-spacing:.28em;
    color:#c9c9c9;
    text-transform:uppercase;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="mark">
      <svg viewBox="0 0 44 44">
        <circle cx="22" cy="22" r="19"/>
        <path d="M13 22.5 L19 28.5 L31 15.5"/>
      </svg>
    </div>
    <div class="eyebrow">Request received</div>
    <h1>Thank you, we've got it.</h1>
    <p>Your quote request has reached Nové Studios. We personally review every request and reply within one business day.</p>
    <p>Want a faster answer? Message us directly on WhatsApp.</p>
    <div class="divider"></div>
    <a class="wa-btn" href="https://wa.me/message/YOUR_WHATSAPP_LINK" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 0 0-8.6 15L2 22l5.2-1.4A10 10 0 1 0 12 2Zm5.8 14.2c-.3.7-1.4 1.3-2 1.4-.5.1-1.1.1-1.8-.1-.4-.1-1-.3-1.7-.6-3-1.3-4.9-4.3-5.1-4.5-.2-.2-1.2-1.6-1.2-3s.8-2.2 1-2.5c.3-.3.6-.4.8-.4h.6c.2 0 .4 0 .6.5l.9 2.1c.1.2.1.4 0 .6l-.5.7c-.1.2-.2.4 0 .6.3.5 1 1.4 2.1 2.3 1.2 1 1.9 1.3 2.2 1.4.2.1.4.1.6-.1l.8-.9c.2-.2.4-.2.6-.1l2 1c.2.1.4.2.4.4.1.3.1.9-.2 1.6Z"/></svg>
      Continue on WhatsApp
    </a>
    <div class="brand">Nové Studios</div>
  </div>
</body>
</html>
